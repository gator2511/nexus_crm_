name: Nexus CRM Test Execution
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: server
      - name: Execute infrastructure and CRM tests
        run: node --test --test-reporter=tap test/crm.integration.test.js | tee test-results.tap; exit ${PIPESTATUS[0]}
        working-directory: server
        shell: bash
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-crm-test-results
          path: server/test-results.tap
          if-no-files-found: ignore
